<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WhatsApp Sender</title>
  <style>
    :root { --bg:#f6f8f6; --card:#fff; --ink:#16231c; --muted:#5d6b63; --line:#d9e1dc; --accent:#0f7a4a; --err:#b3261e; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#101612; --card:#18211b; --ink:#e8efea; --muted:#94a39a; --line:#2a362e; --accent:#3ccf86; --err:#ff8a80; }
    }
    * { box-sizing: border-box; }
    body { margin:0; padding:20px; min-height:100vh; background:var(--bg); color:var(--ink); font:16px/1.5 system-ui, "Segoe UI", Roboto, sans-serif; }
    main { max-width:480px; margin:40px auto; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:24px; }
    h1 { font-size:1.25rem; margin:0 0 4px; }
    p.sub { margin:0 0 20px; color:var(--muted); font-size:.9rem; }
    label { display:block; font-weight:600; font-size:.9rem; margin:14px 0 6px; }
    input, textarea { width:100%; padding:10px 12px; font:inherit; color:var(--ink); background:transparent; border:1px solid var(--line); border-radius:8px; }
    input:focus, textarea:focus, button:focus-visible { outline:2px solid var(--accent); outline-offset:1px; }
    textarea { min-height:110px; resize:vertical; }
    button { margin-top:18px; width:100%; padding:12px; font:inherit; font-weight:600; color:#fff; background:var(--accent); border:0; border-radius:8px; cursor:pointer; }
    @media (prefers-color-scheme: dark) { button { color:#06210f; } }
    button:disabled { opacity:.6; cursor:wait; }
    #status { margin-top:16px; min-height:1.5em; font-size:.92rem; }
    #status.ok { color:var(--accent); }
    #status.err { color:var(--err); }
  </style>
</head>
<body>
<main>
  <h1>Send a WhatsApp message</h1>
  <p class="sub">Sandbox users must send the join code to the Twilio number first.</p>

  <label for="to">Phone number</label>
  <input id="to" type="tel" placeholder="+919876543210" autocomplete="off">

  <label for="msg">Message</label>
  <textarea id="msg" placeholder="Type your message"></textarea>

  <button id="send" type="button">Send message</button>
  <div id="status" role="status" aria-live="polite"></div>
</main>

<script>
  // 1. Paste your Apps Script /exec URL here.
  // 2. Paste the same value you set for API_TOKEN in Script Properties.
  var APP_URL   = "https://script.google.com/macros/s/AKfycbx-lY5jXKHp2jyInqoZwatwpAna9wIh12onnmHsDzNK-Q19yNeZMu0I0xwX-DLAluqS/exec";
  var API_TOKEN = "fa28d6c8-3621-4204-9c01-3927c947944d";

  var btn = document.getElementById('send');
  var statusEl = document.getElementById('status');

  function show(text, cls) { statusEl.textContent = text; statusEl.className = cls || ''; }

  btn.addEventListener('click', function () {
    var to = document.getElementById('to').value.trim();
    var msg = document.getElementById('msg').value.trim();
    if (!to || !msg) { show('Enter a phone number and a message.', 'err'); return; }

    btn.disabled = true;
    show('Sending...');

    var url = APP_URL
      + '?action=send'
      + '&to=' + encodeURIComponent(to)
      + '&msg=' + encodeURIComponent(msg)
      + '&token=' + encodeURIComponent(API_TOKEN);

    fetch(url)
      .then(function (res) { return res.json(); })
      .then(function (data) {
        btn.disabled = false;
        if (data.ok) {
          show('Sent. Status: ' + data.status + ' (' + data.sid + ')', 'ok');
        } else {
          show(data.error || 'Send failed.', 'err');
        }
      })
      .catch(function (err) {
        btn.disabled = false;
        show('Network error: ' + err.message, 'err');
      });
  });
</script>
</body>
</html>
