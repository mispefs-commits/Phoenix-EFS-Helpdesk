
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#102344">
  <title>Phoenix EFS |Helpdesk Management</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      min-height: 100%;
      overflow: hidden;
      font-family: "Segoe UI", Arial, sans-serif;
      background: #ffffff;
    }

    body {
      height: 100vh;
      height: 100dvh;
    }

    .app-frame {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background: #ffffff;
    }

    .app-frame iframe {
      display: block;
      width: 100%;
      height: 100%;
      height: 100dvh;
      border: none;
      outline: none;
      background: #ffffff;
    }
  </style>
</head>

<body>
  <main class="app-frame">
    <iframe
      src="https://script.google.com/macros/s/AKfycbxMjJ6kXdlku-lQhoIfEL8eE3ObfLn2mIdaZUxYzhO9bG2qYxbMJxvDGbEhqtVf6gCo5Q/exec"
      title="Phoenix EFS Application"
      allow="clipboard-read; clipboard-write"
      allowfullscreen>
    </iframe>
  </main>
</body>
</html>
